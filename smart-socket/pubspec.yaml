name: smart_socket
description: "AIoT Smart Socket - An Intelligent Power-Aware Electrical Socket Using AI and IoT with ESP32 & PZEM-004T"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  fl_chart: ^0.69.0
  mqtt_client: ^10.4.0
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^17.2.3
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

